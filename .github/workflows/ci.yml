name: CI

# Gate against shipping broken code. The app auto-deploys on push, and
# `vite build` does NOT typecheck on its own, so a type error or broken
# import could otherwise reach production with no warning. This runs the
# typecheck + tests (both must pass) and the production build on every push
# and PR. Lint is informational only for now (131 pre-existing style errors,
# mostly `any` casts — tracked separately, not a deploy blocker).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (blocking)
        run: npm run typecheck

      - name: Tests (blocking)
        run: npm run test

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Production build (blocking)
        run: npm run build
        env:
          # Build only needs these to be present; real values come from the
          # deploy env. Empty placeholders keep the build from erroring on
          # missing-var guards.
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder"
