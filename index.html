<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to image + API hosts so the browser warms DNS+TLS before the
         first request fires. Saves ~100-300ms on the very first image/api hit. -->
    <link rel="preconnect" href="https://images.scrydex.com" crossorigin />
    <link rel="preconnect" href="https://api-mainnet.magiceden.dev" crossorigin />
    <link rel="preconnect" href="https://cmthndfrvnlyfxgxqjkm.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://arweave.net" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <title>Collectiblez — Pokémon TCG Portfolio Tracker</title>
    <meta name="description" content="Track, value, and trade your Pokémon TCG collection with live market prices, 24h/7d trends, and shareable seller profiles." />
    <meta name="author" content="Collectiblez" />

    <meta property="og:title" content="Collectiblez — Pokémon TCG Portfolio Tracker" />
    <meta property="og:description" content="Track, value, and trade your Pokémon TCG collection with live market prices and shareable seller profiles." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://collectiblez.app/" />
    <meta property="og:image" content="https://collectiblez.app/og-image.jpg" />
    <meta property="og:site_name" content="Collectiblez" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Collectiblez — Pokémon TCG Portfolio Tracker" />
    <meta name="twitter:description" content="Track, value, and trade your Pokémon TCG collection with live market prices." />
    <meta name="twitter:image" content="https://collectiblez.app/og-image.jpg" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Collectiblez",
        "url": "https://collectiblez.app/",
        "description": "Pokémon TCG portfolio tracker with live market prices.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://collectiblez.app/explore?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Collectiblez",
        "url": "https://collectiblez.app/",
        "logo": "https://collectiblez.app/favicon.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
